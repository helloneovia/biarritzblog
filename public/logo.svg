<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <!-- Slogan/Icon combined into a sleek premium mark -->
  <g transform="translate(10, 20)">
    <!-- Sleek insole shape -->
    <path d="M15,60 C15,60 5,45 15,25 C25,5 45,-5 60,10 C75,25 65,40 55,55 C45,70 15,60 15,60 Z" fill="url(#gradient)" opacity="0.9"/>
    <!-- Dynamic arch line -->
    <path d="M15,25 C35,15 50,30 55,55" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- "Biarritz" Typography -->
  <text x="100" y="68" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="52" fill="#0B1B3D" letter-spacing="-1.5">
    Biarritz<tspan fill="#4f46e5">.</tspan>
  </text>
  
  <!-- Defs for Gradient -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1B3D" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>
</svg>
